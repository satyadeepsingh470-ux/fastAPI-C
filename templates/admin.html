<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Order Admin</title>
  <style>
    :root { color-scheme: light dark; }
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, Segoe UI, Roboto, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 35%, #f093fb 70%, #f5576c 100%);
      background-attachment: fixed;
      display: flex;
      justify-content: center;
      padding: 48px 16px;
      margin: 0;
      min-height: 100vh;
    }
    .card {
      background: rgba(255,255,255,0.97);
      border-radius: 20px;
      box-shadow: 0 20px 50px rgba(0,0,0,0.25);
      padding: 32px;
      width: 100%;
      max-width: 420px;
      border: 1px solid rgba(255,255,255,0.5);
    }
    h1 {
      font-size: 22px; margin: 0 0 4px;
      background: linear-gradient(90deg, #764ba2, #f5576c);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      font-weight: 800;
    }
    .sub { color: #999; font-size: 13px; margin-bottom: 24px; font-weight: 600; }
    label { display: block; font-size: 13px; font-weight: 700; color: #333; margin-bottom: 6px; }
    input {
      width: 100%;
      padding: 12px 14px;
      border-radius: 10px;
      border: 2px solid #e2e4ec;
      font-size: 15px;
      margin-bottom: 20px;
      outline: none;
      transition: border-color 0.2s;
    }
    input:focus { border-color: #764ba2; }
    .statuses {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 20px;
    }
    .status-btn {
      border: 2px solid #e2e4ec;
      background: #fff;
      border-radius: 12px;
      padding: 12px 8px;
      font-size: 13px;
      font-weight: 700;
      color: #444;
      cursor: pointer;
      transition: all 0.15s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }
    .status-btn:hover { border-color: #764ba2; transform: translateY(-1px); }
    .status-btn.selected {
      background: linear-gradient(90deg, #667eea, #764ba2);
      border-color: transparent;
      color: #fff;
    }
    button.submit {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 12px;
      background: linear-gradient(90deg, #f093fb, #f5576c);
      color: #fff;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 6px 16px rgba(245,87,108,0.35);
      transition: transform 0.15s;
    }
    button.submit:hover { transform: translateY(-1px); }
    button.submit:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
    .toast {
      margin-top: 16px;
      font-size: 13px;
      font-weight: 600;
      text-align: center;
      min-height: 18px;
    }
    .toast.ok { color: #10b981; }
    .toast.err { color: #ef4444; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Update order status</h1>
    <div class="sub">Restaurant / admin panel</div>

    <label for="orderId">Order ID</label>
    <input id="orderId" type="text" placeholder="e.g. 123" />

    <label>Status</label>
    <div class="statuses" id="statuses">
      <button class="status-btn" data-status="pending">⏳ Pending</button>
      <button class="status-btn" data-status="confirmed">✅ Confirmed</button>
      <button class="status-btn" data-status="preparing">👨‍🍳 Preparing</button>
      <button class="status-btn" data-status="shipped">📦 Shipped</button>
      <button class="status-btn" data-status="out_for_delivery">🚚 Out for delivery</button>
      <button class="status-btn" data-status="delivered">🎉 Delivered</button>
    </div>

    <button class="submit" id="submitBtn">Update status</button>
    <div class="toast" id="toast"></div>
  </div>

  <script>
    const orderInput = document.getElementById("orderId");
    const buttons = [...document.querySelectorAll(".status-btn")];
    const submitBtn = document.getElementById("submitBtn");
    const toast = document.getElementById("toast");
    let selected = null;

    buttons.forEach((btn) => {
      btn.addEventListener("click", () => {
        buttons.forEach((b) => b.classList.remove("selected"));
        btn.classList.add("selected");
        selected = btn.dataset.status;
      });
    });

    submitBtn.addEventListener("click", async () => {
      const orderId = orderInput.value.trim();
      toast.textContent = "";
      toast.className = "toast";

      if (!orderId) {
        toast.textContent = "Enter an order ID first";
        toast.className = "toast err";
        return;
      }
      if (!selected) {
        toast.textContent = "Pick a status first";
        toast.className = "toast err";
        return;
      }

      submitBtn.disabled = true;
      try {
        const res = await fetch(`/orders/${orderId}/status`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ status: selected }),
        });
        if (!res.ok) throw new Error("Request failed");
        toast.textContent = `Order ${orderId} updated to "${selected}"`;
        toast.className = "toast ok";
      } catch (e) {
        toast.textContent = "Failed to update status";
        toast.className = "toast err";
      } finally {
        submitBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
